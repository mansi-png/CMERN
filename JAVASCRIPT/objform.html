<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Methods Example</title>
</head>
<body>

<script>

var stdDetails = [
    {
        id: "25",
        name: "Harsh Raj",
        age: "25",
        class: "SA",
        email: "harsh@gmail.com",
    },
    {
        id: "04",
        name: "Aditya",
        age: "25",
        class: "SA",
        email: "aditya@gmail.com",
    },
    {
        id: "41",
        name: "Nishant",
        age: "25",
        class: "SA",
        email: "nishant@gmail.com",
    },
    {
        id: "34",
        name: "Krishna",
        age: "25",
        class: "SA",
        email: "krishna@gmail.com",
    },
];

// forEach()
stdDetails.forEach((data) => {
    console.log(
        "forEach name:",
        data.name,
        "age:",
        data.age,
        "class:",
        data.class,
        "email:",
        data.email
    );
});

// map()
var mapData = stdDetails.map((data) => {
    return data.name;
});
console.log("Map Data:", mapData);

// filter()
var filterData = stdDetails.filter((data) => {
    return data.age > 10;
});
console.log("Filtered Data:", filterData);

// reduce()
var arr1 = [1, 2, 3, 4, 5];
var reduceData = arr1.reduce((acc, curr) => {
    return acc + curr;
}, 0);
console.log("Reduced Data:", reduceData);

</script>

</body>
</html>
