<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>


<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    h1 {
        color: #333;
    }

    form {
        margin-bottom: 20px;
    }

    input[type="text"] {
        padding: 10px;
        width: 300px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        padding: 10px 15px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #218838;
    }

    ul {
        list-style-type: none;
        padding-left: 0;
    }

    li {
        padding: 10px;
        background-color: #f8f9fa;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .deleteBtn {
        background-color: red;
    }

    .deleteBtn:hover {
        background-color: darkred;
    }
</style>


</head>

<body>


<h1>To-Do List</h1>

<form id="form">
    <input type="text" id="taskInput" placeholder="Enter a task" required>
    <button type="submit">Add Task</button>
</form>

<section id="taskCont">
    <h2>Tasks</h2>
    <ul id="tasks"></ul>
</section>

<script>
    const form = document.getElementById('form');
    const taskInput = document.getElementById('taskInput');
    const tasksList = [];
    const tasks = document.getElementById('tasks');

    // Display tasks
    function addEle() {
        tasks.innerHTML = '';

        tasksList.forEach((data, index) => {
            tasks.innerHTML += `
                <li>
                    <span>${data}</span>
                    <button class="deleteBtn" onclick="deleteTask(${index})">
                        Delete
                    </button>
                </li>
            `;
        });
    }

    // Add task
    form.addEventListener('submit', (event) => {
        event.preventDefault();

        const task = taskInput.value.trim();

        if (task) {
            tasksList.push(task);
            addEle();
            taskInput.value = '';
        }
    });

    // Delete task
    function deleteTask(index) {
        tasksList.splice(index, 1);
        addEle();
    }
</script>


</body>
</html>
