<body>
    <script>
        //if-else
        var marks1 = parseInt(prompt("Enter the Marks1:"));
        var marks2 = parseInt(prompt("Enter the Marks2:"));
        var marks3 = parseInt(prompt("Enter the Marks3:"));
        var marks4 = parseInt(prompt("Enter the Marks4:")); 

        var avg = (marks1 + marks2 + marks3 + marks4)/4;

        if (avg >= 90 && avg < 100) {
            console.log(`A and ${avg}`);
        }
        else if (avg >= 80 && avg < 90) {
            console.log(`B and ${avg}`);
        }
        else if (avg >= 70 && avg < 80) {
            console.log(`C and ${avg}`);
        }
        else if (avg >= 60 && avg < 70) {
            console.log(`D and ${avg}`);
        }
        else {
            console.log(`E and ${avg}`);
        }

        //switch

        var day = 'tues';

        switch (day){
            case 'mon':
                console.log("Monday");
                break;
        }

        //ternary

    </script>
