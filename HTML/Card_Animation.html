<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Surprise</title>
  <style>
    main {
      width: 600px;
      height: 700px;
      margin: auto;
      box-shadow: 0 0 15px 5px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    article {
      width: 100%;
      height: 100%;
      background-color: #e49ebe;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative; 
      transition: opacity 2s ease-in-out;
    }

    article h1 {
      font-size: 50px;
      color: brown;
      margin-bottom: 20px;
    }
    article p {
      font-size: 20px;
      color: black;
    }

    section {
      width: 100%;
      height: 100%;
      display: flex;
      position: absolute;
      top: 0;
      left: 0;
    }

    section > div {
      background: linear-gradient(brown, #e12278, brown);
      height: 100%;
      flex: 1;
      border: 2px solid black;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 5s ease-in-out;
    }

    section div a {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background-color: black;
      display: inline-block;
      border: 2px solid black;
    }

    
    #main:target .door1 {
      transform: translateX(-100%);
    }
    #main:target .door2 {
      transform: translateX(100%);
    }

    
    #main:target article {
      opacity: 1;
    }
  </style>
</head>
<body>
  <main id="main">
    <article>
      <h1> Happy Birthday!</h1>
      <p>Wishing you a day full of happiness and joy!</p>
    </article>
    <section>
      <div class="door1"><a href="#main"></a></div>
      <div class="door2"><a href="#main"></a></div>
    </section>
  </main>
</body>
</html>
