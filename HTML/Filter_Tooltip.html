<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            font-size:20px;
            margin:30px;
            position:relative;
            width:500px;
        }
        span{
            background-color:black;
            color:white;
            visibility:hidden;
            bottom:100%;
            position:absolute;
            right:0px;
            font-size:10px;

        }
        p:hover span{
            visibility:visible;
        }

        img {
            width: 400px;
            height: auto;
            display: block;
            margin: 20px;
            animation: fadeimg  4s infinite alternate linear; 
        }
        @keyframes fadeimg {
            0% {
                filter: grayscale(100%);
            }
            25% {
                filter: grayscale(75%);
            }
            50%{
                filter: grayscale(50%);
            }
            75%{
                filter:grayscale(25%)
            }
            100%{
                filter: grayscale(0%);
            }
        }
       
    </style>
</head>
<body>
    <p>Hello<span>Your Name</span></p>
    <img src="https://cdn.pixabay.com/photo/2017/09/03/10/16/dolphin-2709809_1280.jpg" alt="Dolphin">
</body>
</html>
