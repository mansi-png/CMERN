<html>

<head>

    <title>Complete Registration Form</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ff9b68;
            padding: 40px;
        }

        .form-box {
            width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        fieldset {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        legend {
            font-weight: bold;
            padding: 0 10px;
            color: #ff7043;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            color: #444;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="tel"],
        input[type="url"],
        input[type="date"],
        input[type="time"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .options {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }

        .options label {
            margin: 0;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        input[type="color"] {
            width: 70px;
            height: 40px;
        }

        input[type="range"] {
            width: 100%;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .submit {
            background-color: #ff7043;
            color: white;
        }

        .reset {
            background-color: #ddd;
            color: #333;
        }

        button:hover {
            opacity: 0.85;
        }

        @media (max-width: 650px) {

            body {
                padding: 20px;
            }

            .form-box {
                width: 100%;
            }

            .options {
                flex-direction: column;
                gap: 8px;
            }

        }

    </style>

</head>


<body>

    <div class="form-box">

        <h1>Registration Form</h1>


        <form>


            <!-- ================= PERSONAL INFORMATION ================= -->

            <fieldset>

                <legend>Personal Information</legend>


                <!-- Text -->

                <label>Full Name</label>

                <input
                    type="text"
                    name="fullname"
                    placeholder="Enter your full name"
                >


                <!-- Email -->

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                >


                <!-- Password -->

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                >


                <!-- Confirm Password -->

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                >


                <!-- Number -->

                <label>Age</label>

                <input
                    type="number"
                    name="age"
                    min="1"
                    max="100"
                    placeholder="Enter your age"
                >


                <!-- Phone -->

                <label>Phone Number</label>

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter your phone number"
                >


                <!-- Date -->

                <label>Date of Birth</label>

                <input
                    type="date"
                    name="dob"
                >


                <!-- Gender -->

                <label>Gender</label>

                <div class="options">

                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>

                </div>

            </fieldset>



            <!-- ================= ADDRESS ================= -->

            <fieldset>

                <legend>Address Information</legend>


                <label>Street Address</label>

                <input
                    type="text"
                    name="street"
                    placeholder="Enter your street address"
                >


                <label>City</label>

                <!-- Datalist -->

                <input
                    list="cities"
                    name="city"
                    placeholder="Type or select city"
                >

                <datalist id="cities">

                    <option value="Delhi">
                    <option value="Mumbai">
                    <option value="Mathura">
                    <option value="Agra">
                    <option value="Jaipur">
                    <option value="Lucknow">

                </datalist>


                <label>State</label>

                <select name="state">

                    <option value="">Select State</option>
                    <option>Uttar Pradesh</option>
                    <option>Delhi</option>
                    <option>Rajasthan</option>
                    <option>Maharashtra</option>
                    <option>Haryana</option>

                </select>


                <label>PIN Code</label>

                <input
                    type="text"
                    name="pincode"
                    placeholder="Enter PIN code"
                >

            </fieldset>



            <!-- ================= EDUCATION ================= -->

            <fieldset>

                <legend>Education</legend>


                <label>Course</label>

                <select name="course">

                    <option value="">Select Course</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>B.Sc</option>
                    <option>M.Tech</option>

                </select>


                <label>Skills</label>

                <div class="options">

                    <label>
                        <input type="checkbox" name="skill" value="html">
                        HTML
                    </label>

                    <label>
                        <input type="checkbox" name="skill" value="css">
                        CSS
                    </label>

                    <label>
                        <input type="checkbox" name="skill" value="javascript">
                        JavaScript
                    </label>

                </div>


                <label>Portfolio Website</label>

                <input
                    type="url"
                    name="website"
                    placeholder="https://example.com"
                >

            </fieldset>



            <!-- ================= OTHER INFORMATION ================= -->

            <fieldset>

                <legend>Other Information</legend>


                <!-- Time -->

                <label>Preferred Contact Time</label>

                <input
                    type="time"
                    name="contact_time"
                >


                <!-- File -->

                <label>Upload Profile Picture</label>

                <input
                    type="file"
                    name="profile"
                >


                <!-- Color -->

                <label>Choose Your Favorite Color</label>

                <input
                    type="color"
                    name="color"
                >


                <!-- Range -->

                <label>Programming Skill Level</label>

                <input
                    type="range"
                    name="skill_level"
                    min="0"
                    max="100"
                    value="50"
                >


                <!-- Textarea -->

                <label>About Yourself</label>

                <textarea
                    name="about"
                    placeholder="Write something about yourself..."
                ></textarea>


                <!-- Checkbox -->

                <div class="options">

                    <label>
                        <input
                            type="checkbox"
                            name="terms"
                        >
                        I agree to the Terms and Conditions
                    </label>

                </div>

            </fieldset>



            <!-- ================= BUTTONS ================= -->

            <div class="buttons">

                <button
                    type="submit"
                    class="submit"
                >
                    Submit
                </button>


                <button
                    type="reset"
                    class="reset"
                >
                    Reset
                </button>

            </div>


        </form>

    </div>

</body>

</html>
